<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/gasd-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GASD — Get All Shit Done</title>
    <script>
      try {
        const theme = localStorage.getItem("gasd-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
